<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1a18">
    <meta name="theme-color" content="#ecece8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a18" media="(prefers-color-scheme: dark)">
    <title>Track Gym</title>
    <meta name="description" content="Track Gym - Tu compañero de entrenamiento" />
    <meta name="author" content="Track Gym" />

    <meta property="og:title" content="Track Gym" />
    <meta property="og:description" content="Track Gym - Tu compañero de entrenamiento" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Track Gym" />
    <meta name="twitter:description" content="Track Gym - Tu compañero de entrenamiento" />
    <meta name="twitter:image" content="/logo.svg" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
  </head>

  <body>
    <script>
      (function() {
        var accent = localStorage.getItem("vite-ui-accent");
        if (accent && ["green","orange","yellow","pink","blue"].indexOf(accent) !== -1) {
          document.documentElement.setAttribute("data-accent", accent);
        }

        var theme = localStorage.getItem("vite-ui-theme");
        var resolved;
        if (theme === "light") {
          resolved = "light";
        } else if (theme === "system") {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } else {
          resolved = "dark";
        }
        if (resolved === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
