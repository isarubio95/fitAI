<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin `maximum-scale`: bloqueaba el pinch-zoom, que es un requisito de
         accesibilidad. El doble-tap-zoom accidental ya lo evita
         `touch-action: manipulation` sobre los elementos interactivos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Hex de `--background-fill`. Sin `media`: el tema de la app no es el del sistema. -->
    <meta name="theme-color" content="#0c0c0b">
    <title>Track Gym</title>
    <meta name="description" content="Track Gym - Tu compañero de entrenamiento" />
    <meta name="author" content="Track Gym" />

    <meta property="og:title" content="Track Gym" />
    <meta property="og:description" content="Track Gym - Tu compañero de entrenamiento" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Track Gym" />
    <meta name="twitter:description" content="Track Gym - Tu compañero de entrenamiento" />
    <meta name="twitter:image" content="/logo.svg" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
  </head>

  <body>
    <script>
      (function() {
        var accent = localStorage.getItem("vite-ui-accent");
        if (accent && ["green","orange","yellow","pink","blue"].indexOf(accent) !== -1) {
          document.documentElement.setAttribute("data-accent", accent);
        }

        var theme = localStorage.getItem("vite-ui-theme");
        var resolved;
        if (theme === "light") {
          resolved = "light";
        } else if (theme === "system") {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } else {
          resolved = "dark";
        }
        if (resolved === "dark") {
          document.documentElement.classList.add("dark");
        }
        var themeColor = resolved === "light" ? "#ecece9" : "#0c0c0b";
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute("content", themeColor);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
